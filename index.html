<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="journal-hero" aria-label="Journal workspace">
        <div class="hero-copy">
          <p class="eyebrow" id="todayLabel">Today</p>
          <h1>My Journal</h1>
          <p class="hero-note">A private place to land your thoughts, track your mood, and keep small moments from slipping away.</p>
        </div>
      </section>

      <section class="workspace" aria-label="Journal editor and entries">
        <aside class="sidebar" aria-label="Entries">
          <div class="sidebar-header">
            <div>
              <p class="section-kicker">Saved locally</p>
              <h2>Entries</h2>
            </div>
            <button class="icon-button" id="newEntryButton" type="button" aria-label="New entry" title="New entry">+</button>
          </div>

          <label class="search">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Find a thought..." autocomplete="off" />
          </label>

          <div class="entry-list" id="entryList" aria-live="polite"></div>
        </aside>

        <section class="editor" aria-label="Write journal entry">
          <div class="editor-topbar">
            <div>
              <p class="section-kicker">Current entry</p>
              <input id="titleInput" class="title-input" type="text" placeholder="Give today a title" maxlength="80" />
            </div>
            <div class="status-pill" id="saveStatus">Ready</div>
          </div>

          <div class="meta-row">
            <label>
              <span>Date</span>
              <input id="dateInput" type="date" />
            </label>
            <label>
              <span>Mood</span>
              <select id="moodInput">
                <option value="calm">Calm</option>
                <option value="grateful">Grateful</option>
                <option value="tender">Tender</option>
                <option value="focused">Focused</option>
                <option value="heavy">Heavy</option>
                <option value="hopeful">Hopeful</option>
              </select>
            </label>
          </div>

          <div class="prompt-strip">
            <button class="prompt-button active" type="button" data-prompt="What do I want to remember about today?">
              Remember
            </button>
            <button class="prompt-button" type="button" data-prompt="What felt heavy, and what helped me carry it?">
              Release
            </button>
            <button class="prompt-button" type="button" data-prompt="What am I grateful for right now?">
              Gratitude
            </button>
            <button class="prompt-button" type="button" data-prompt="What do I need next?">
              Next
            </button>
          </div>

          <label class="prompt-box">
            <span>Prompt</span>
            <input id="promptInput" type="text" value="What do I want to remember about today?" />
          </label>

          <label class="body-field">
            <span>Entry</span>
            <textarea id="bodyInput" placeholder="Start writing here..."></textarea>
          </label>

          <div class="actions">
            <button id="saveButton" class="primary-button" type="button">Save entry</button>
            <button id="deleteButton" class="secondary-button" type="button">Delete</button>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
